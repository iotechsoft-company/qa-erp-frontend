name: E2E

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter (e.g. @smoke, @regression)'
        default: '@smoke'
  schedule:
    - cron: '0 1 * * 1-5' # 08:00 Asia/Bangkok, จ.–ศ.
  pull_request:

# Public repo: least-privilege token for every job.
permissions:
  contents: read

jobs:
  e2e:
    # Fork PRs get no secrets and must not touch the dev environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_ENV: ${{ vars.TEST_ENV }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_STAFF_USERNAME: ${{ secrets.E2E_STAFF_USERNAME }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      ALLOW_MUTATION: ${{ vars.ALLOW_MUTATION || 'false' }}
      # passed via env, never interpolated into the script (prevents injection through the input)
      GREP: ${{ inputs.grep || '@smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --grep "$GREP"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
